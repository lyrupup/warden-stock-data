name: warden_stock_data

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB:-warden_data}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    image: warden_stock_data-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      - postgres
      - redis
    env_file:
      - ../.env
    environment:
      # 容器网络内使用 compose 服务名，覆盖 .env 中的 localhost
      PG_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
