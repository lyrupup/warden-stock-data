name: warden_stock_data

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warden_data
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    image: warden_stock_data-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      APP_PORT: 8080
      APP_ENV: dev
      JWT_SECRET: change_me_dev_only
      CONFIG_ENC_KEY: 32_bytes_key_for_aes_gcm________
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DB: warden_data
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MARKET_PROVIDER: gotdx
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
